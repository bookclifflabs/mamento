var MVSTEPS=[
[["kettlebell glute bridge","glute bridge"],["Lie on your back, knees bent, feet hip-width apart. Hold the bell on your hip bones.","Breathe in to get ready. Breathe out and press through your heels to lift your hips.","Stop when your hips and knees make a line. Ribs stay down, glutes do the work.","Breathe in at the top. Lower slowly, one bone at a time."]],
[["single-leg kettlebell bridge"],["Set up like a two-leg bridge, bell on your hip bones. Lift one foot off the floor.","Breathe out and press through the other heel to lift your hips.","Keep your hips level. Do not let one side drop or your back arch.","Lower slowly. Finish all reps, then switch legs."]],
[["banded bridge with abduction"],["Lie on your back, knees bent, with a band just above your knees.","Press your knees out into the band and keep them there.","Breathe out and lift your hips. Hold 2 seconds and keep breathing.","Lower slowly with the knees still pressing out."]],
[["kettlebell hip thrust"],["Sit on the floor with your upper back against a bench or couch. Bell on your hip bones, feet flat.","Breathe out and drive through your heels to lift your hips.","At the top your shins are straight up and down and your ribs are down. Hold 1 second.","Lower with control and breathe in at the bottom."]],
[["kettlebell goblet squat to chair","squat to a chair","chair squats"],["Stand in front of a chair, feet shoulder-width apart. Hold the bell close to your chest.","Breathe in. Sit your hips back and bend your knees until you lightly touch the chair.","Knees stay in line with your toes. Chest stays tall.","Breathe out and press through your whole foot to stand up."]],
[["kettlebell goblet squat"],["Stand with feet shoulder-width apart. Hold the bell close to your chest.","Breathe in. Sit your hips back and bend your knees.","Go down only as far as you can keep your heels down and chest tall.","Breathe out and press through your whole foot to stand up."]],
[["incline push-up","low-incline push-up","push-up"],["Place your hands on a counter, bench or the floor, a little wider than your shoulders. Body in one straight line.","Breathe in and bend your elbows to lower your chest toward your hands.","Keep your belly flat. If it domes, use a higher surface.","Breathe out and press away from the surface."]],
[["wall push-ups"],["Stand an arm's length from the wall. Hands on the wall at shoulder height, a little wider than your shoulders.","Breathe in and bend your elbows to bring your chest toward the wall.","Keep your body in one straight line.","Breathe out and press back to the start."]],
[["supported kettlebell row"],["Stand beside a bench or sturdy chair. Rest one hand on it and hinge forward with a flat back.","Let the bell hang under your shoulder.","Breathe out and pull your elbow up toward your hip.","Breathe in and lower slowly. Finish all reps, then switch sides."]],
[["single-arm kettlebell row"],["Stand with your feet hip-width apart and hinge forward with a flat back. Rest your free hand on your thigh or a bench.","Let the bell hang under your shoulder.","Breathe out and pull your elbow up toward your hip.","Breathe in and lower slowly. Finish all reps, then switch sides."]],
[["kettlebell bent-over row"],["Hold the bell with both hands. Hinge forward with a flat back and soft knees.","Let the bell hang below your chest.","Breathe out and pull your elbows toward your hips.","Breathe in and lower slowly. Keep your back flat."]],
[["dead bug"],["Lie on your back with knees over hips and arms up. Press your low back gently into the floor.","Breathe in to get ready. Breathe out and slowly lower the opposite arm and leg.","Go only as far as your low back stays flat and your belly stays flat.","Return to the start and switch sides."]],
[["bird dog"],["Start on hands and knees, hands under shoulders and knees under hips. Keep your spine long.","Breathe out and slide one leg straight back. Keep your hips level.","Hold 2 seconds and keep breathing.","Return with control and switch sides."]],
[["bird dog, legs only"],["Start on hands and knees, hands under shoulders and knees under hips.","Breathe out and slide one leg straight back. Do not let your trunk move.","Hold 2 seconds and keep breathing.","Return with control and switch sides."]],
[["kettlebell deadlift","kettlebell suitcase deadlift","kettlebell romanian deadlift","hip hinge"],["Stand with feet hip-width apart. Hold the bell in front of you or at your side.","Breathe in. Push your hips back with a flat back and a soft bend in your knees.","Lower the bell along your legs until you feel your hamstrings stretch.","Breathe out and push your hips forward to stand tall."]],
[["kettlebell halo"],["Stand tall and hold the bell upside down at your chest, close to your body.","Breathe normally. Circle the bell slowly around your head.","Keep your ribs down and do not lean back.","Do half the circles one way, then switch direction."]],
[["kettlebell floor press","single-arm kettlebell floor press"],["Lie on your back, knees bent, feet flat. Hold the bell by your chest with your elbow on the floor.","Breathe out and press the bell straight up.","Keep your belly flat and your ribs down.","Breathe in and lower until your elbow touches the floor."]],
[["single-arm kettlebell press"],["Stand tall and hold the bell at your shoulder.","Breathe out and press it straight up by your ear.","Keep your ribs down and do not arch your back.","Breathe in and lower to your shoulder. Finish all reps, then switch sides."]],
[["banded side steps","banded lateral walk","side steps"],["Put a light band above your knees. Stand with feet hip-width apart and a small bend in your knees.","Step one foot out to the side, keeping tension on the band.","Bring the other foot in without letting your knees fall inward.","Take all the steps one way, then walk back the other way."]],
[["side-lying clamshell","banded clamshell","clamshells"],["Lie on your side with knees bent and feet together. Add a band above your knees if it says banded.","Breathe out and open your top knee like a clamshell. Keep your feet together.","Do not let your hips roll back.","Lower slowly. Finish all reps, then switch sides."]],
[["kettlebell reverse lunge"],["Stand tall, holding a wall or chair with one hand and the bell in the other.","Breathe in and step one foot back.","Lower until both knees are bent, with your front knee over your ankle.","Breathe out and press through your front foot to stand. Finish all reps, then switch sides."]],
[["kettlebell split squat"],["Stand in a long step, one foot forward and one back. Hold a wall or chair for balance.","Breathe in and lower straight down.","Front knee stays over your ankle and chest stays tall.","Breathe out and press through your front foot to stand. Finish all reps, then switch sides."]],
[["kettlebell farmer's carry","kettlebell suitcase carry","walk"],["Hold a bell in each hand, or one bell for a suitcase carry. Stand tall with your shoulders down.","Take slow, steady steps and keep breathing.","Keep your ribs stacked over your hips. Do not lean to the side.","Walk the set distance, then put the bell down with a flat back."]],
[["pallof press"],["Stand sideways to a band that is anchored at chest height. Hold the band at your chest with both hands.","Breathe out and press your hands straight out.","Do not let the band turn you. Hold 2 seconds.","Breathe in and bring your hands back to your chest. Finish all reps, then switch sides."]],
[["kettlebell low step-up"],["Stand facing a low, sturdy step with the bell at your chest or by your side.","Place one foot fully on the step.","Breathe out and press through that foot to stand tall.","Lower slowly. Finish all reps, then switch legs."]],
[["side plank (knees)","side plank"],["Lie on your side with knees bent and your elbow under your shoulder.","Breathe out and lift your hips so your body makes a line from knees to head.","Hold and keep breathing. Keep your belly flat.","Lower slowly. Finish, then switch sides."]],
[["360 breathing"],["Sit or lie down comfortably. Rest your hands on your lower ribs.","Breathe in through your nose and feel your ribs widen like an umbrella.","Breathe out slowly and let your ribs soften.","Keep your shoulders relaxed and use about 30% effort."]],
[["transverse abdominis \"zipper\"","transverse abdominis “zipper”","transverse abdominis zipper"],["Lie on your back with knees bent. Rest your hands on your lower belly.","Breathe in and let your belly expand.","Breathe out and gently draw your lower belly in from your pant line up to your ribs.","Keep it light. Do not suck in, tilt your pelvis or squeeze your glutes."]],
[["blow before you lift"],["Before you lift anything, including your baby, take a breath in.","Start to breathe out gently through your lips as you begin to lift.","Keep breathing out through the effort.","Never hold your breath or strain, including on the toilet."]],
[["thoracic extension (foam roller)","thoracic extension"],["Lie on your back with a foam roller under your shoulder blades. Hands behind your head, knees bent.","Keep your ribs down and your low back relaxed.","Breathe in and gently lean back over the roller. Hold 3 to 4 seconds.","Breathe out and lift back up. Move the roller up or down a little to try a new spot."]],
[["figure 4 stretch"],["Lie on your back with knees bent. Cross one ankle over the opposite knee.","Hold behind your thigh and gently pull toward you.","Breathe slowly and keep your head and shoulders relaxed.","Hold 30 seconds, then switch sides."]],
[["hip flexor stretch"],["Kneel on one knee with the other foot forward, or stand in a long step.","Tuck your pelvis under and squeeze your glute on the back side.","Gently shift forward until you feel a stretch at the front of your back hip.","Breathe slowly and hold 30 seconds, then switch sides."]],
[["prone on elbows"],["Lie face down with your elbows under your shoulders.","Press gently through your forearms to lift your chest.","Let your belly and low back relax and breathe slowly.","Stop if you feel pulling at your belly or a scar, or any pain."]],
[["settle in"],["Lie down or sit in a comfy spot.","Let your shoulders, jaw and hands soften.","Breathe in through your nose and out slowly.","Stay for a few breaths before you start."]],
[["knee rocks"],["Lie on your back with knees bent and feet together.","Let both knees fall slowly to one side.","Move gently and keep your shoulders on the floor.","Bring them back to the middle and rock to the other side."]],
[["knees to chest"],["Lie on your back and bring one or both knees toward your chest.","Hold behind your thighs, not on your kneecaps.","Breathe slowly and let your low back relax.","Hold 20 to 30 seconds, then lower slowly."]],
[["cat-cow"],["Start on hands and knees, hands under shoulders and knees under hips.","Breathe in and let your belly drop as you lift your head and tailbone.","Breathe out and round your back toward the ceiling.","Move slowly with your breath."]],
[["child's pose, wide knees","child’s pose, wide knees"],["Start on hands and knees. Spread your knees wide and bring your big toes together.","Sit your hips back toward your heels.","Reach your arms forward and rest your forehead down.","Breathe slowly into your back and stay as long as you like."]],
[["legs up the wall"],["Sit with one hip against a wall, then lie back and swing your legs up the wall.","Move closer or farther from the wall until it feels comfortable.","Rest your arms by your sides and breathe slowly.","Stay 2 to 5 minutes. Bend your knees to come out."]],
[["rest and check in"],["Lie down or sit comfortably.","Close your eyes if you like and breathe slowly.","Notice how your body feels, including your belly, pelvic floor and back.","Note anything that needs attention before your next session."]],
[["calf raises"],["Stand tall near a wall or counter for balance, feet hip-width apart.","Breathe out and rise onto your toes.","Hold 1 second at the top.","Breathe in and lower slowly."]],
[["floor to stand"],["Start sitting on the floor. Bring one foot flat and place your hands beside you.","Breathe out and press through your feet and hands to lift your hips.","Walk your hands toward your legs as you stand up.","Stand tall and breathe. Reverse the steps to sit back down."]],
[["pelvic tilts"],["Lie on your back with knees bent and feet flat.","Breathe out and gently tilt your pelvis to flatten your low back.","Breathe in and return to neutral.","Move slowly and keep your glutes and thighs relaxed."]],
[["heel slides"],["Lie on your back with knees bent and feet flat. Gently engage your lower belly.","Breathe out and slide one heel away along the floor.","Keep your pelvis still and your low back flat.","Breathe in and slide back. Switch sides."]],
[["toe taps"],["Lie on your back with knees bent over your hips.","Breathe out and lower one foot to tap the floor.","Keep your low back flat and belly flat.","Bring the leg back up and switch sides."]]];
